# One image, one container: UI, API and live events all on port 3000.
services:
  app:
    build: .
    environment:
      - PORT=3000
      - DATA_FILE=/app/data/db.json
    ports: ["3000:3000"]
    volumes: ["trade-data:/app/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  trade-data:
